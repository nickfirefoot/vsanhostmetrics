# Known findings the build cannot fix from this repository. The CI scan
# fails on any other HIGH or CRITICAL finding that has a fix available.
# Each entry is scoped to the exact package version, so it stops matching
# once that version is gone, and expires so it gets looked at again.
vulnerabilities:
  # cryptography 44.0.0 is pinned exactly by vmware-aria-operations-integration-sdk-lib
  # 1.1.0 (install_requires "cryptography == 44.0.0"), the newest SDK library.
  - id: CVE-2026-26007
    purls: ["pkg:pypi/cryptography@44.0.0"]
    statement: Pinned by the SDK library; clears when the SDK library releases a newer pin.
    expired_at: 2027-01-11
  - id: CVE-2026-69247
    purls: ["pkg:pypi/cryptography@44.0.0"]
    statement: Pinned by the SDK library; clears when the SDK library releases a newer pin.
