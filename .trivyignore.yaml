  # adapter does not import them; they clear when pip ships updated copies.
  - id: GHSA-6v7p-g79w-8964
    purls: ["pkg:pypi/msgpack@1.1.2"]
    statement: Vendored inside pip in the SDK base image, not used by the adapter.
    expired_at: 2027-01-11
